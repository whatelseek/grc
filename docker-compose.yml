services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bia}
      POSTGRES_DB: ${POSTGRES_DB:-bia}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bia} -d ${POSTGRES_DB:-bia}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bia}:${POSTGRES_PASSWORD:-bia}@db:5432/${POSTGRES_DB:-bia}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence:/data/evidence
    depends_on:
      db:
        condition: service_healthy
    # Create the schema and the bootstrap admin, then serve.
    command: >
      sh -c "python -m app.cli init && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  evidence:
